---
# Handlers for metrics exporter

- name: reload systemd
  systemd:
    daemon_reload: yes

- name: restart nimbus-benchmark-metrics
  systemd:
    name: nimbus-benchmark-metrics
    state: restarted

- name: restart github runner
  systemd:
    name: '{{ nimbus_eth1_github_runner_service_name }}'
    state: restarted
    daemon_reload: yes

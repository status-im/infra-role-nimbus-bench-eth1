---
# short benchmark will be default unless overriden in group vars
nimbus_eth1_benchmark_type: 'short'
nimbus_eth1_service_name: 'nimbus-eth1-{{ nimbus_eth1_network }}-{{ nimbus_eth1_repo_branch }}-{{ nimbus_eth1_benchmark_type }}-benchmark'
nimbus_eth1_service_path: '/data/{{ nimbus_eth1_service_name }}'
nimbus_eth1_service_user_ssh_dir: '/home/{{ nimbus_eth1_service_user }}/.ssh'
nimbus_eth1_service_user_ssh_config: '{{ nimbus_eth1_service_user_ssh_dir }}/config'
nimbus_eth1_service_user: 'nimbus'
nimbus_eth1_service_group: 'staff'

# Benchmark runs are started by a GitHub Actions workflow through a self-hosted runner.
# Request, log and result of a run are exchanged with the runner through this directory.
nimbus_eth1_benchmark_trigger_dir: '/var/lib/nimbus-benchmark-trigger'

# GitHub Actions runner
nimbus_eth1_github_runner_repo_url: 'https://github.com/status-im/nimbus-eth1-benchmarks'
nimbus_eth1_github_runner_name: '{{ inventory_hostname }}'
nimbus_eth1_github_runner_labels: ['nimbus-bench-{{ nimbus_eth1_benchmark_type }}']
nimbus_eth1_github_runner_user: 'ghrunner'
nimbus_eth1_github_runner_group: 'ghrunner'
nimbus_eth1_github_runner_path: '/var/lib/github-runner'
nimbus_eth1_github_runner_service_name: 'github-runner-nimbus-bench'
nimbus_eth1_github_runner_version: '2.336.0'
nimbus_eth1_github_runner_tarball: 'actions-runner-linux-x64-{{ nimbus_eth1_github_runner_version }}.tar.gz'
nimbus_eth1_github_runner_tarball_url: 'https://github.com/actions/runner/releases/download/v{{ nimbus_eth1_github_runner_version }}/{{ nimbus_eth1_github_runner_tarball }}'
nimbus_eth1_github_runner_tarball_sha256: '04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d'
# Registration tokens live for an hour and are only needed for the first run, pass one on the CLI:
#   -e github_runner_registration_token=<token>
nimbus_eth1_github_runner_registration_token: '{{ github_runner_registration_token | default("") }}'

# Metrics Configuration
metrics_listen_host: '0.0.0.0'
metrics_listen_port: 9091
metrics_refresh_interval: 10
metrics_dir: '/var/lib/nimbus-benchmark-metrics'

nimbus_eth1_service_scripts_base: '/data/scripts'
# Paths
nimbus_eth1_logs_link: '{{ nimbus_eth1_service_path }}/logs'

# Config
nimbus_eth1_valid_log_levels:  [TRACE, DEBUG, INFO, NOTICE, WARN, ERROR, FATAL]
nimbus_eth1_log_level: 'DEBUG'
nimbus_eth1_valid_networks: [mainnet, sepolia, holesky]
nimbus_eth1_network: 'mainnet'

# Repo
nimbus_eth1_repo_branch: 'master'
nimbus_eth1_repo_url: 'https://github.com/status-im/nimbus-eth1'
nimbus_eth1_benchmarks_repo_url: 'git@github.com:status-im/nimbus-eth1-benchmarks.git'
nimbus_eth1_benchmarks_ssh_key_file: '{{ nimbus_eth1_service_user_ssh_dir }}/id_rsa'
nimbus_eth1_benchmarks_repo_ssh_key: '{{lookup("vault", "nimbus/eth1/benchmark", field="github_webhook_ssh_key", override=True)}}'

# Git identity and commit signing for pushes to the benchmarks repo.
nimbus_eth1_git_user_name: 'Autobot'
nimbus_eth1_git_user_email: '40699771+status-im-auto@users.noreply.github.com'
nimbus_eth1_git_signing_key_file: '{{ nimbus_eth1_service_user_ssh_dir }}/id_ed25519_signing'
nimbus_eth1_git_signing_key: '{{lookup("vault", "nimbus/eth1/benchmark", field="github_signing_ssh_key", override=True)}}'

# Benchmark paths
nimbus_eth1_benchmarks_repo: '/data/status-im/nimbus-eth1-benchmarks'
nimbus_eth1_repo: '/data/status-im/nimbus-eth1'
nimbus_eth1_template_db: '/data/template-db'
nimbus_eth1_host_benchmarks_dir: '/data/host-benchmarks'
nimbus_eth1_era1_dir: '/data/era1'
nimbus_eth1_era_dir: '/data/era'
nimbus_eth1_rocksdb_cache_dir: '{{ nimbus_eth1_service_path }}/rocksdb-cache'

# Benchmark configuration
nimbus_eth1_max_blocks_to_import: 1000000

# Special Discord alerting
nimbus_eth1_benchmark_discord_alerts: true
nimbus_eth1_benchmark_discord_webhook_url: '{{ lookup("vault", "nimbus/eth1/benchmark", field="discord_webhook_url", override=True)}}'
# will mention @siddarthkay for failures
nimbus_eth1_benchmark_discord_mention_id: '{{ lookup("vault", "nimbus/eth1/benchmark", field="discord_mention_user_id", override=True)}}'
